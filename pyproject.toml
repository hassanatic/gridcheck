[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridcheck"
version = "0.1.0"
description = "Grid code compliance checks for power plant test records (fault ride-through, LFSM-O, frequency and voltage ranges)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyyaml>=6.0", "pandapower>=2.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["gridcheck"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
